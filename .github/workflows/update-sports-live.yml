name: Update live sports scores

on:
  workflow_dispatch:
  schedule:
    # Hourly fallback; Cloudflare is primary. UTC -> ART: 15:37..00:37 (10 slots/day).
    - cron: '37 18-23 * * *'
    - cron: '37 0-3 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: sports-today-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test generator offline
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Refresh real live scores
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_sports_today.py --live
      - name: Commit only the updated feed
        shell: bash
        run: |
          git add -- sports_today.json
          if git diff --cached --quiet -- sports_today.json; then
            echo "Live scores unchanged; no commit."
            exit 0
          fi
          git config user.name "MBox Sports Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update live sports scores" --only -- sports_today.json
          git push origin HEAD:main
